<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技活动日历</title>
<style>
:root {
  --surface: #ffffff;
  --surface-muted: #f4f4f6;
  --bg: #f7f7f8;
  --text: #171717;
  --text-muted: #52525b;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4b3fe3;
  --brand-soft: #f2f7ff;
  --brand-soft-strong: #e5eaff;
  --brand-text: #1a1759;
  --brand-on: #ffffff;
  --success: #1dc981;
  --danger: #e8463a;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --font-sans: "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1e1e20;
    --surface-muted: #2a2a2d;
    --bg: #171717;
    --text: #e5e5e5;
    --text-muted: #a1a1aa;
    --border: rgba(229, 229, 229, 0.14);
    --brand: #6054f1;
    --brand-soft: #1a1759;
    --brand-soft-strong: #3c2eca;
    --brand-text: #cfd8ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 14px/20px var(--font-sans);
}
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

/* 顶栏 */
.head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 4px 4px 12px; }
.title { font: 600 20px/28px var(--font-sans); }
.sub { font-size: 12px; line-height: 18px; color: var(--text-muted); margin-top: 2px; }
.city-pick { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 4px 12px; }
.city-pick select { border: none; background: transparent; color: var(--text); font: 500 12px/18px var(--font-sans); outline: none; cursor: pointer; }

/* 筛选与排序 */
.toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 8px 0 12px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: 500 12px/18px var(--font-sans); color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 4px 12px; cursor: pointer; transition: all .1s; }
.pill:hover { border-color: var(--brand); color: var(--brand); }
.pill.on { background: var(--brand-soft-strong); border-color: var(--brand); color: var(--brand-text); }
.seg { display: flex; gap: 4px; background: var(--surface-muted); border-radius: var(--radius); padding: 4px; }
.seg button { font: 500 12px/18px var(--font-sans); color: var(--text-muted); background: transparent; border: none; border-radius: var(--radius); padding: 4px 12px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 8px 0 12px; }
.search { display: flex; flex: 1 1 280px; align-items: center; gap: 8px; }
.search input { flex: 1; min-width: 0; }
.filters input[type="search"], .filters select { min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.check { display: flex; align-items: center; min-height: 44px; gap: 6px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.plain-btn { min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.pill, .seg button, .city-pick select { min-height: 44px; }
.update { padding: 12px 16px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); color: var(--text-muted); }
.update.warn { border-color: var(--danger); }
.update p { margin: 0 0 6px; }
.update summary { cursor: pointer; min-height: 44px; display: list-item; padding-top: 12px; }
.update ul { margin: 8px 0; padding-left: 20px; }
.source-note { font-size: 12px; }

/* 列表 */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 12px 16px; }
.row.dim { opacity: .55; }
.date { flex-shrink: 0; width: 54px; text-align: center; }
.date .m { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.date .d { font: 600 18px/22px var(--font-sans); font-variant-numeric: tabular-nums; }
.main { flex: 1; min-width: 0; }
.name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.badge { flex-shrink: 0; font-size: 12px; line-height: 18px; font-weight: 500; border-radius: var(--radius-full); padding: 0 8px; }
.badge.open { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
.badge.closing { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.badge.ongoing { color: var(--brand); background: var(--brand-soft); }
.badge.todo, .badge.unknown { color: var(--text-muted); background: var(--surface-muted); }
.badge.done { color: var(--text-muted); background: var(--surface-muted); }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; line-height: 18px; color: var(--text-muted); margin-top: 4px; }
.meta .ddl-hot { color: var(--danger); font-weight: 500; }
.chip { font-size: 12px; line-height: 18px; color: var(--text-muted); background: var(--surface-muted); border-radius: var(--radius); padding: 0 8px; }
.chip.onl { color: var(--brand-text); background: var(--brand-soft); }
.right { flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
.prize-btn { font: 500 12px/18px var(--font-sans); color: var(--text-muted); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-full); padding: 5px 12px; cursor: pointer; flex-shrink: 0; }
.prize-btn:hover { border-color: var(--brand); color: var(--brand); }
.reward { display: none; flex-basis: 100%; margin-top: 2px; padding: 10px 12px; background: var(--surface-muted); border-radius: var(--radius); font-size: 13px; line-height: 20px; color: var(--text); }
.row.prize-open .reward { display: block; }
.go { font: 500 12px/18px var(--font-sans); color: var(--brand-on); background: var(--brand); border: none; border-radius: var(--radius-full); padding: 6px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.go:hover { opacity: .88; }
.empty { text-align: center; color: var(--text-muted); padding: 48px 0; }
.foot { margin-top: 16px; font-size: 12px; line-height: 18px; color: var(--text-muted); text-align: center; }

@media (max-width: 640px) {
  .row { flex-wrap: wrap; }
  .date { width: 48px; }
  .right { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="title">科技活动日历</div>
      <div class="sub" id="count" role="status" aria-live="polite">加载中…</div>
    </div>
    <label class="city-pick">📍 我的城市
      <select id="city"><option value="">全部</option></select>
    </label>
  </div>
  <div class="filters" role="search" aria-label="活动搜索与筛选">
    <label class="search" for="search">搜索<input id="search" type="search" placeholder="名称、主办方、城市或地点" autocomplete="off"></label>
    <label for="registration">报名状态 <select id="registration">
      <option value="">全部</option><option value="available">可报名</option>
      <option value="closing">即将截止</option><option value="closed">报名已结束</option>
      <option value="unknown">待确认</option>
    </select></label>
    <label class="check"><input id="online-only" type="checkbox">仅线上</label>
    <label class="check"><input id="hide-ended" type="checkbox">隐藏已结束活动</label>
    <button id="reset-filters" class="plain-btn" type="button">清除筛选</button>
  </div>
  <div class="toolbar">
    <div class="tags" id="tags"></div>
    <div class="seg" id="sort">
      <button data-sort="smart" class="on">综合</button>
      <button data-sort="time">时间最近</button>
      <button data-sort="ddl">截止临近</button>
      <button data-sort="prize">奖金</button>
    </div>
  </div>
  <div class="update" id="update-status" role="status" aria-live="polite">正在加载活动数据…</div>
  <div class="list" id="list" aria-busy="true"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="event-status.js"></script>
<script src="event-view.js"></script>
<script>
(function () {
  var state = { cat: '全部', city: '', sort: 'smart', query: '', registration: '', onlineOnly: false, hideEnded: false };
  var ALL = [];
  var DATA = null;
  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function updateNotice(data) {
    var health = EventView.health(data);
    var box = document.getElementById('update-status');
    box.className = 'update' + (health.warning ? ' warn' : '');
    box.innerHTML = '<p>' + escapeHtml(health.title) + '</p><div class="source-note">数据更新：'
      + escapeHtml(data.updated_at || '未知') + '（北京时间） · 计划每日更新</div>'
      + (health.sources.length ? '<details><summary>查看来源更新情况</summary><ul>' + health.sources.map(function (s) {
        var label = { ok: '更新成功', cached: '更新失败，使用保留数据', failed: '更新失败，暂无保留数据' }[s.status] || '状态未知';
        return '<li>' + escapeHtml(s.name) + '：' + label + ' · ' + s.count + ' 条 · 最近成功：' + escapeHtml(s.lastSuccess) + '</li>';
      }).join('') + '</ul></details>' : health.failedNames.length ? '<div class="source-note">异常来源：' + escapeHtml(health.failedNames.join('、')) + '；旧数据未记录各来源成功时间。</div>' : '');
  }

  // ---- 状态计算 ----
  function status(e) {
    var phases = EventStatus.evaluate(e);
    if (phases.activity === 'done') return 'done';
    if (phases.registration === 'open' || phases.registration === 'closing') return phases.registration;
    return phases.activity;
  }
  var RANK = { closing: 0, open: 1, ongoing: 2, todo: 3, unknown: 4, done: 5 };
  var LABEL = { ongoing: '进行中', todo: '待开始', unknown: '活动时间待确认', done: '已结束' };
  var REG_LABEL = { open: '报名中', closing: '即将截止', closed: '报名已结束', unknown: '报名状态待确认' };

  function dayNum(str) {
    if (!str) return null;
    var t = Date.parse(str + 'T00:00:00+08:00');
    return isNaN(t) ? null : Math.round(t / 86400000);
  }

  // ---- 渲染 ----
  function visible() {
    return EventView.filter(ALL, state);
  }
  function sorted(list) {
    var arr = list.slice();
    var today = dayNum(new Date().toISOString().slice(0, 10));
    var cityBoost = function (e) {
      if (!state.city) return 1;
      if (e.city === state.city) return 0;
      if (e.online) return 1;
      return 2;
    };
    // 报名中/即将截止的活动按报名截止日排序（最紧急在前），其余按开始日期最近的在前
    var smartKey = function (e) {
      var st = status(e);
      var ddl = dayNum(e.reg_deadline);
      if ((st === 'open' || st === 'closing') && ddl !== null) return ddl;
      var s = dayNum(e.start);
      return s !== null ? -s : -1e9;
    };
    if (state.sort === 'smart') arr.sort(function (a, b) { return cityBoost(a) - cityBoost(b) || RANK[status(a)] - RANK[status(b)] || smartKey(a) - smartKey(b); });
    if (state.sort === 'time') arr.sort(function (a, b) { return cityBoost(a) - cityBoost(b) || Math.abs((dayNum(a.start) === null ? 1e9 : dayNum(a.start) - today)) - Math.abs((dayNum(b.start) === null ? 1e9 : dayNum(b.start) - today)); });
    if (state.sort === 'ddl') arr.sort(function (a, b) { return cityBoost(a) - cityBoost(b) || (dayNum(a.reg_deadline) === null ? 1e9 : dayNum(a.reg_deadline)) - (dayNum(b.reg_deadline) === null ? 1e9 : dayNum(b.reg_deadline)); });
    if (state.sort === 'prize') arr.sort(function (a, b) { return cityBoost(a) - cityBoost(b) || (b.prize || 0) - (a.prize || 0); });
    return arr;
  }
  function fmtPrize(e) {
    if (e.prize_text) return e.prize_text;
    if (e.prize) return e.prize >= 10000 ? '¥' + (e.prize / 10000) + '万' : '¥' + e.prize;
    return '';
  }
  function render() {
    var list = sorted(visible()), html = '';
    list.forEach(function (e) {
      var phases = EventStatus.evaluate(e), st = phases.activity;
      // 无开始日期时用报名截止日展示，避免日期块显示 "?"
      var dateSrc = e.start || e.reg_deadline || '';
      var md = dateSrc.split('-');
      // 非今年活动在月份旁标注年份，便于识别跨年活动
      var mLabel = md[1] ? (+md[1] + '月') : '待定';
      if (md[0] && +md[0] !== new Date().getFullYear()) {
        mLabel = ("'" + md[0].slice(2)) + '/' + mLabel;
      }
      var badge = '<span class="badge ' + st + '">' + LABEL[st] + '</span>';
      badge += '<span class="badge ' + (phases.registration === 'closed' || phases.registration === 'unknown' ? 'todo' : phases.registration) + '">' + REG_LABEL[phases.registration] + '</span>';
      var ddlText = e.reg_deadline
        ? (phases.registration === 'closing' ? '<span class="ddl-hot">报名截止 ' + e.reg_deadline + ' ⚠</span>' : '报名截止 ' + e.reg_deadline)
        : '';
      var chips = (e.category ? '<span class="chip cat">' + e.category + '</span>' : '');
      if (e.online) chips += '<span class="chip onl">线上</span>';
      var prize = fmtPrize(e);
      html += '<div class="row' + (st === 'done' ? ' dim' : '') + '">'
        + '<div class="date"><div class="m">' + mLabel + '</div><div class="d">' + (md[2] ? +md[2] : '—') + '</div></div>'
        + '<div class="main"><div class="name"><span class="n">' + e.name + '</span>' + badge + '</div>'
        + '<div class="meta">'
        + '<span>' + e.city + '</span>'
        + (e.org ? '<span>·</span><span>' + e.org + '</span>' : '')
        + (ddlText ? '<span>·</span><span>' + ddlText + '</span>' : '')
        + chips
        + '</div></div>'
        + '<div class="right">'
        + (prize ? '<button class="prize-btn" type="button">奖品</button>' : '')
        + '<a class="go" href="' + e.url + '" target="_blank" rel="noopener">直达 ↗</a>'
        + '</div>'
        + (prize ? '<div class="reward">' + prize + '</div>' : '')
        + '</div>';
    });
    document.getElementById('list').innerHTML = html || '<div class="empty">没有符合条件的活动<br>试试更换关键词或清除筛选</div>';
    document.getElementById('count').textContent = '显示 ' + list.length + ' / ' + ALL.length + ' 场活动' + (state.city ? ' · ' + state.city + '优先（不限制城市）' : '');
  }

  // ---- 初始化控件 ----
  function initControls(data) {
    var cities = {};
    data.events.forEach(function (e) { cities[e.city] = 1; });
    var cats = ['全部', '竞赛', '榜单赛事', '展会', '黑客松', '会议'];
    document.getElementById('tags').innerHTML = cats.map(function (t) {
      return '<button class="pill' + (t === state.cat ? ' on' : '') + '" aria-pressed="' + (t === state.cat) + '" data-cat="' + t + '">' + t + '</button>';
    }).join('');
    document.getElementById('city').innerHTML = '<option value="">全部</option>' + Object.keys(cities).sort().map(function (c) {
      return '<option value="' + c + '"' + (c === state.city ? ' selected' : '') + '>' + c + '</option>';
    }).join('');

    document.getElementById('tags').addEventListener('click', function (ev) {
      var b = ev.target.closest('.pill'); if (!b) return;
      this.querySelectorAll('.pill').forEach(function (p) { p.classList.remove('on'); p.setAttribute('aria-pressed', 'false'); });
      b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); state.cat = b.dataset.cat; render();
    });
    document.getElementById('sort').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (p) { p.classList.remove('on'); });
      b.classList.add('on'); state.sort = b.dataset.sort; render();
    });
    document.getElementById('city').addEventListener('change', function () {
      state.city = this.value;
      try { localStorage.setItem('hkx-city', state.city); } catch (e) {}
      render();
    });
    document.getElementById('search').addEventListener('input', function () { state.query = this.value; render(); });
    document.getElementById('registration').addEventListener('change', function () { state.registration = this.value; render(); });
    document.getElementById('online-only').addEventListener('change', function () { state.onlineOnly = this.checked; render(); });
    document.getElementById('hide-ended').addEventListener('change', function () { state.hideEnded = this.checked; render(); });
    document.getElementById('reset-filters').addEventListener('click', function () {
      state.query = ''; state.registration = ''; state.onlineOnly = false; state.hideEnded = false; state.cat = '全部';
      document.getElementById('search').value = ''; document.getElementById('registration').value = '';
      document.getElementById('online-only').checked = false; document.getElementById('hide-ended').checked = false;
      document.getElementById('tags').querySelectorAll('.pill').forEach(function (p) {
        var selected = p.dataset.cat === '全部'; p.classList.toggle('on', selected); p.setAttribute('aria-pressed', String(selected));
      });
      render();
    });
    document.getElementById('list').addEventListener('click', function (ev) {
      var b = ev.target.closest('.prize-btn'); if (!b) return;
      var row = b.closest('.row');
      if (row) row.classList.toggle('prize-open');
    });
  }

  // ---- 加载数据 ----
  fetch('data/hackathons.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (data) {
    if (!Array.isArray(data.events)) throw new Error('无效活动数据');
    DATA = data; ALL = data.events;
    try { state.city = localStorage.getItem('hkx-city') || ''; } catch (e) {}
    initControls(data);
    render();
    updateNotice(data);
    document.getElementById('list').setAttribute('aria-busy', 'false');
    document.getElementById('foot').textContent = '共 ' + ALL.length + ' 场活动 · 报名及时间信息请以活动官网为准';
  }).catch(function () {
    document.getElementById('list').setAttribute('aria-busy', 'false');
    document.getElementById('update-status').className = 'update warn';
    document.getElementById('update-status').textContent = '活动数据加载失败，请刷新页面重试。';
    document.getElementById('count').textContent = '数据加载失败';
    document.getElementById('list').innerHTML = '<div class="empty">无法加载 data/hackathons.json<br>如果直接双击打开本文件，请用本地服务器预览：<br>python -m http.server</div>';
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && DATA) { render(); updateNotice(DATA); }
  });
})();
</script>
</body>
</html>
