name: Update hackathon data

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: |
          python -B -m unittest discover -s tests -v
          node tests/event-status.test.js
          node tests/event-view.test.js
          node tests/page-controls.test.js

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hackathons.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "chore: auto update hackathon data ($(date -u +%Y-%m-%d))"
            git push
          fi
